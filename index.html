<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="theme-color" content="#4f46e5" />
  <title>TaskFlow — To-Do List</title>
  <style>
    :root { color-scheme: light; --bg:#f5f7fb; --surface:#fff; --text:#172033; --muted:#697386; --border:#e5e7eb; --primary:#4f46e5; --primary-dark:#3730a3; --danger:#dc2626; }
    * { box-sizing:border-box; }
    body { margin:0; min-height:100vh; font-family:Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background:linear-gradient(135deg,#eef2ff,var(--bg)); color:var(--text); }
    .app { width:min(100% - 2rem, 760px); margin:0 auto; padding:3rem 0; }
    .hero { margin-bottom:1.5rem; }
    h1 { margin:0 0 .45rem; font-size:clamp(2rem,6vw,3.2rem); letter-spacing:-.04em; }
    .subtitle { margin:0; color:var(--muted); }
    .card { background:rgba(255,255,255,.9); border:1px solid rgba(229,231,235,.9); border-radius:1.25rem; box-shadow:0 18px 50px rgba(31,41,55,.08); padding:1.25rem; }
    .add-form { display:flex; gap:.75rem; margin-bottom:1.25rem; }
    input, select, button { font:inherit; }
    input, select { border:1px solid var(--border); border-radius:.75rem; background:var(--surface); color:var(--text); padding:.8rem .9rem; outline:none; }
    input:focus, select:focus { border-color:var(--primary); box-shadow:0 0 0 3px rgba(79,70,229,.12); }
    #task-input { flex:1; min-width:0; }
    button { border:0; border-radius:.75rem; padding:.8rem 1rem; cursor:pointer; transition:.2s ease; }
    button:hover { transform:translateY(-1px); }
    .primary { background:var(--primary); color:#fff; font-weight:700; }
    .primary:hover { background:var(--primary-dark); }
    .toolbar { display:flex; flex-wrap:wrap; align-items:center; justify-content:space-between; gap:.75rem; margin-bottom:1rem; }
    .filters { display:flex; flex-wrap:wrap; gap:.45rem; }
    .filter { background:#eef2ff; color:#4338ca; padding:.55rem .75rem; font-size:.9rem; }
    .filter.active { background:var(--primary); color:#fff; }
    .stats { color:var(--muted); font-size:.9rem; }
    .task-list { list-style:none; margin:0; padding:0; display:grid; gap:.65rem; }
    .task { display:flex; align-items:center; gap:.75rem; padding:.85rem; border:1px solid var(--border); border-radius:.9rem; background:#fff; }
    .task.done { background:#fafafa; }
    .task-check { width:1.2rem; height:1.2rem; accent-color:var(--primary); flex:0 0 auto; }
    .task-title { flex:1; overflow-wrap:anywhere; }
    .task.done .task-title { color:#9ca3af; text-decoration:line-through; }
    .delete { background:#fee2e2; color:var(--danger); padding:.55rem .7rem; }
    .delete:hover { background:#fecaca; }
    .empty { display:none; padding:2.5rem 1rem; text-align:center; color:var(--muted); }
    .empty.show { display:block; }
    .footer-actions { display:flex; justify-content:flex-end; margin-top:1rem; }
    .clear { background:transparent; color:var(--danger); padding:.4rem; font-size:.9rem; }
    @media (max-width:520px) { .app { padding:2rem 0; } .add-form { flex-direction:column; } .add-form button { width:100%; } .toolbar { align-items:flex-start; flex-direction:column; } }
  </style>
</head>
<body>
  <main class="app">
    <header class="hero">
      <h1>TaskFlow</h1>
      <p class="subtitle">A simple to-do list that saves your tasks automatically.</p>
    </header>

    <section class="card" aria-label="To-do list">
      <form class="add-form" id="task-form">
        <input id="task-input" type="text" maxlength="160" placeholder="What needs to be done?" autocomplete="off" required />
        <button class="primary" type="submit">Add task</button>
      </form>

      <div class="toolbar">
        <div class="filters" role="group" aria-label="Filter tasks">
          <button class="filter active" type="button" data-filter="all">All</button>
          <button class="filter" type="button" data-filter="active">Active</button>
          <button class="filter" type="button" data-filter="completed">Completed</button>
        </div>
        <span class="stats" id="task-count">0 tasks</span>
      </div>

      <ul class="task-list" id="task-list"></ul>
      <div class="empty" id="empty-state">No tasks here yet. Add one above.</div>
      <div class="footer-actions"><button class="clear" type="button" id="clear-completed">Clear completed</button></div>
    </section>
  </main>

  <script>
    const STORAGE_KEY = 'taskflow-tasks-v1';
    let tasks = loadTasks();
    let currentFilter = 'all';

    function loadTasks() {
      try {
        const saved = JSON.parse(localStorage.getItem(STORAGE_KEY));
        return Array.isArray(saved) ? saved : [];
      } catch { return []; }
    }

    function saveTasks() {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    }

    function visibleTasks() {
      if (currentFilter === 'active') return tasks.filter(task => !task.completed);
      if (currentFilter === 'completed') return tasks.filter(task => task.completed);
      return tasks;
    }

    function render() {
      const list = document.getElementById('task-list');
      const empty = document.getElementById('empty-state');
      const visible = visibleTasks();
      list.innerHTML = '';

      visible.forEach(task => {
        const item = document.createElement('li');
        item.className = `task${task.completed ? ' done' : ''}`;
        item.innerHTML = `
          <input class="task-check" type="checkbox" ${task.completed ? 'checked' : ''} aria-label="Mark task complete" />
          <span class="task-title"></span>
          <button class="delete" type="button" aria-label="Delete task">Delete</button>
        `;
        item.querySelector('.task-title').textContent = task.title;
        item.querySelector('.task-check').addEventListener('change', () => {
          task.completed = !task.completed;
          saveTasks();
          render();
        });
        item.querySelector('.delete').addEventListener('click', () => {
          tasks = tasks.filter(candidate => candidate.id !== task.id);
          saveTasks();
          render();
        });
        list.appendChild(item);
      });

      empty.classList.toggle('show', visible.length === 0);
      const remaining = tasks.filter(task => !task.completed).length;
      document.getElementById('task-count').textContent = `${remaining} ${remaining === 1 ? 'task' : 'tasks'} left`;
    }

    document.getElementById('task-form').addEventListener('submit', event => {
      event.preventDefault();
      const input = document.getElementById('task-input');
      const title = input.value.trim();
      if (!title) return;
      tasks.unshift({ id: crypto.randomUUID ? crypto.randomUUID() : `${Date.now()}-${Math.random()}`, title, completed: false });
      saveTasks();
      input.value = '';
      input.focus();
      render();
    });

    document.querySelectorAll('.filter').forEach(button => {
      button.addEventListener('click', () => {
        currentFilter = button.dataset.filter;
        document.querySelectorAll('.filter').forEach(item => item.classList.toggle('active', item === button));
        render();
      });
    });

    document.getElementById('clear-completed').addEventListener('click', () => {
      tasks = tasks.filter(task => !task.completed);
      saveTasks();
      render();
    });

    render();
  </script>
</body>
</html>
